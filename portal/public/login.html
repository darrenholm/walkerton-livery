<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Livery Staff Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%94%91</text></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body class="login-page">

<div class="login-box">
    <h1>The Livery</h1>
    <p class="sub">Staff portal</p>

    <div class="card">
        <div id="err" class="err hide"></div>
        <div class="fields">
            <div class="f wide">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false">
            </div>
            <div class="f wide">
                <label for="pw">Password</label>
                <input id="pw" type="password" autocomplete="current-password">
            </div>
        </div>
        <button class="btn btn-block" id="go" style="margin-top:18px">Sign in</button>
    </div>
</div>

<script src="app.js"></script>
<script>
const { el, api, setToken, showError } = Portal;

async function signIn() {
    const btn = el('go');
    btn.disabled = true;
    el('err').classList.add('hide');
    try {
        const data = await api('/api/login', {
            method: 'POST',
            body: JSON.stringify({ email: el('email').value, password: el('pw').value }),
        });
        setToken(data.token);
        location.href = data.me.mustChangePassword ? 'password.html' : 'index.html';
    } catch (e) {
        showError(el('err'), e.message);
        btn.disabled = false;
    }
}

el('go').onclick = signIn;
for (const id of ['email', 'pw']) {
    el(id).addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
}
el('email').focus();
</script>
</body>
</html>
