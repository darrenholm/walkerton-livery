<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password — Livery Staff Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%94%91</text></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="wrap" id="main" style="max-width:520px" hidden>
    <div class="page-title">
        <h1>Change password</h1>
    </div>

    <div class="note hide" id="forced">
        Set your own password before using the portal. The one you were given is
        temporary and everyone who handed it over knows it.
    </div>

    <div class="card">
        <div id="err" class="err hide"></div>
        <div class="fields">
            <div class="f wide">
                <label for="cur">Current password</label>
                <input id="cur" type="password" autocomplete="current-password">
            </div>
            <div class="f wide">
                <label for="next">New password</label>
                <input id="next" type="password" autocomplete="new-password">
                <span class="hint">At least 10 characters. Not all digits.</span>
            </div>
            <div class="f wide">
                <label for="again">New password again</label>
                <input id="again" type="password" autocomplete="new-password">
            </div>
        </div>
        <button class="btn btn-block" id="go" style="margin-top:18px">Save password</button>
        <p style="margin:14px 0 0;text-align:center;font-size:14px">
            <a href="index.html" id="backLink">Back to the portal</a>
        </p>
    </div>
</div>

<script src="app.js"></script>
<script>
const { el, api, setToken, showError, toast } = Portal;

(async () => {
    const me = await Portal.start('password.html');
    if (!me) return;

    el('main').hidden = false;
    if (me.mustChangePassword) {
        el('forced').classList.remove('hide');
        // Nowhere else to go until this is done, so do not offer a way out.
        el('backLink').parentElement.classList.add('hide');
    }
})();

async function save() {
    el('err').classList.add('hide');
    const next = el('next').value;

    if (next !== el('again').value) {
        return showError(el('err'), 'The two new passwords do not match.');
    }

    const btn = el('go');
    btn.disabled = true;
    try {
        const data = await api('/api/me/password', {
            method: 'POST',
            body: JSON.stringify({ current: el('cur').value, next }),
        });
        // The old token was invalidated server-side by the epoch bump.
        setToken(data.token);
        toast('Password changed');
        setTimeout(() => { location.href = 'index.html'; }, 700);
    } catch (e) {
        showError(el('err'), e.message);
        btn.disabled = false;
    }
}

el('go').onclick = save;
el('again').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
</script>
</body>
</html>
